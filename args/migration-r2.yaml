# Config for migration devnet R2: EIP-8347 empty-state MPT->PBT, quiet (no chaos)
# acceptance-shaped run at the milestone-2 offset. Same 4-participant shape as
# args/migration.yaml (1 bootnode + 3 under test) so results are comparable, but
# chaos_profile: none — this run isolates the fork mechanics from disruption.
#
# Everything except the pbt_* blocks is ethpandaops/ethereum-package's own
# schema — it fails on any key it does not recognise.

participants:
  # PARTICIPANT 1 IS THE BOOTNODE: protected, exactly as in devnet.yaml/migration.yaml.
  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

network_params:
  network: "kurtosis"
  preset: mainnet
  seconds_per_slot: 6
  genesis_delay: 60
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0

ethereum_genesis_generator_params:
  image: pbt-egg:local
  extra_env:
    PBT: "true"

additional_services:
  - dora        # 36000  block explorer
  - spamoor     # 36002  transaction spammer + UI
  - assertoor   # 36004  test playbooks + UI
  - disruptoor  # 36006  partition injection (needs `kurtosis run --privileged`); unused here (chaos_profile: none) but kept so port ordering matches every other migration args file

port_publisher:
  additional_services:
    enabled: true
    public_port_start: 36000

dora_params:
  image: ethpandaops/dora:latest

spamoor_params:
  start_chainload: false
  start_fuzzing: false
  spammers:
    - scenario: eoatx
      name: "EOA baseline"
      config: {throughput: 20, max_pending: 40, max_wallets: 40, base_fee: 20}
    - scenario: deploytx
      name: "Contract deploys (code-zone leaves)"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}
    - scenario: setcodetx
      name: "EIP-7702 delegations"
      config: {throughput: 2, max_pending: 4, max_wallets: 10, base_fee: 20}
    - scenario: storagespam
      name: "Storage growth"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}

assertoor_params:
  run_stability_check: false
  run_block_proposal_check: true
  run_transaction_test: true
  tests:
    - https://raw.githubusercontent.com/ethpandaops/assertoor/master/playbooks/dev/synchronized-check.yaml

disruptoor_params:
  image: ethpandaops/disruptoor:latest

### Everything below is ours, not ethereum-package's.

pbt_hammer:
  enabled: false

pbt_monitor:
  expected_genesis_root: ""

# 1800s = 300 slots at 6s, the milestone-2 offset — see args/migration.yaml for the
# expected-canonical-blocks arithmetic behind that number. chaos_profile: none: this
# run's purpose is the fork mechanics at the R2 timeline, not disruption survival.
pbt_migration:
  enabled: true
  fork_offset_seconds: 1800
  chaos_profile: none
