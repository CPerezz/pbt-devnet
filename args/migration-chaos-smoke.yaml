# Config for a migration CHAOS-SMOKE run: does the fork survive migration-chaos's
# "smoke" profile end to end, on a short-ish timeline, before committing to the
# multi-hour r3 acceptance run in args/migration.yaml.
#
# 4 participants, not 3: participant 1 is the bootnode (protected, never disrupted —
# see pbt_migration.protect_nodes / DEFAULT_MIGRATION in main.star), so "3 nodes
# under test" is 1 bootnode + 3 disruptable geth, same convention as devnet.yaml and
# migration.yaml.
#
# Everything except the pbt_* blocks is ethpandaops/ethereum-package's own
# schema — it fails on any key it does not recognise.

# Validator weights below are 128/256/128/128 (total 640).
  # Stake is the chaos design (R3 laps 1-2 evidence): participant 2 holds
  # 256 of 640 validators (40%). Isolating it leaves the connected majority
  # at 60% - below the 2/3 finality threshold - so finality STALLS during
  # deep windows instead of finalizing past the victim and triggering the
  # CL peer-scoring bans that stranded uniform-stake victims permanently
  # (remote bans survive a victim restart; `make repeer` cannot clear
  # them). At a 40% proposer share the victim builds depth>=10 inside a
  # 190s window, the 3-minute scale S3 proved heals cleanly.
participants:
  # PARTICIPANT 1 IS THE BOOTNODE: protected, not under chaos.
  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    validator_count: 128
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    validator_count: 256  # the stake-heavy deep victim, see comment above participants
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    validator_count: 128
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    validator_count: 128
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

network_params:
  network: "kurtosis"
  preset: mainnet
  seconds_per_slot: 6
  genesis_delay: 60
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0

ethereum_genesis_generator_params:
  image: pbt-egg:local
  extra_env:
    PBT: "true"

additional_services:
  - dora        # 36000  block explorer
  - spamoor     # 36002  transaction spammer + UI
  - assertoor   # 36004  test playbooks + UI
  - disruptoor  # 36006  partition injection (needs `kurtosis run --privileged`)

port_publisher:
  additional_services:
    enabled: true
    public_port_start: 36000

dora_params:
  image: ethpandaops/dora:latest

spamoor_params:
  start_chainload: false
  start_fuzzing: false
  spammers:
    - scenario: eoatx
      name: "EOA baseline"
      config: {throughput: 20, max_pending: 40, max_wallets: 40, base_fee: 20}
    - scenario: deploytx
      name: "Contract deploys (code-zone leaves)"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}
    - scenario: setcodetx
      name: "EIP-7702 delegations"
      config: {throughput: 2, max_pending: 4, max_wallets: 10, base_fee: 20}
    - scenario: storagespam
      name: "Storage growth"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}

assertoor_params:
  run_stability_check: false
  run_block_proposal_check: true
  run_transaction_test: true
  tests:
    - https://raw.githubusercontent.com/ethpandaops/assertoor/master/playbooks/dev/synchronized-check.yaml

disruptoor_params:
  image: ethpandaops/disruptoor:latest

### Everything below is ours, not ethereum-package's.

pbt_hammer:
  enabled: false

pbt_monitor:
  expected_genesis_root: ""

# 7200s = 1200 slots at 6s. Longer than migration-smoke's 600s so migration-chaos's
# "smoke" profile actually gets a meaningful pre-fork window to disrupt in, shorter
# than migration.yaml's full r3 acceptance timeline.
pbt_migration:
  enabled: true
  fork_offset_seconds: 7200
  chaos_profile: smoke
