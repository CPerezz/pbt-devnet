# Config for the MIGRATION devnet: EIP-8347 empty-state MPT→PBT, geth only.
#
# Unlike args/devnet.yaml (PBT at genesis, six clients under test), this chain
# STARTS on the merkle-patricia trie: the egg emits binaryTrieTime =
# amsterdam_time + pbt_migration.fork_offset_seconds (main.star injects the
# offset — write the number once, under pbt_migration at the bottom). Every
# geth boots through the migration shim baked into pbt-geth:local: init with
# preimages, convert the genesis on a scratch copy, emit the EIP-8347
# artifacts, import them back through the dual-check at anchor 0, then run
# merkle-canonical with the shadow tree riding along until the fork.
#
# Since the #31 online-migration merge the switchover is REAL: at
# binaryTrieTime the header state root swaps to the binary tree, the merkle
# side is maintained through a transition window, and the window closes at
# the first finalized post-fork block (MigrationWindowBlocks stays unset
# everywhere — finality-only close is a precondition the acceptance harness
# checks).
#
# Everything except the pbt_* blocks is ethpandaops/ethereum-package's own
# schema — it fails on any key it does not recognise.

participants:
  # PARTICIPANT 1 IS THE BOOTNODE, exactly as in devnet.yaml: ethereum-package
  # gives the first participant no --boot-nodes of its own, so it must stay
  # out of the disruption rotation. pbt_migration.protect_nodes (default [1]
  # in main.star's DEFAULT_MIGRATION) is what keeps it there — pbt_chaos's own
  # protect_nodes is irrelevant here, because main.star skips pbtchaos
  # entirely in migration mode in favour of migration-chaos.
  #
  # Four participants, not three: "3 nodes under test" plus the dedicated,
  # protected bootnode. With only two disruptable nodes the chaos victim is
  # always the same one and a partition is a 50/50 LMD-GHOST tie, so heal
  # outcomes are nondeterministic; three disruptable nodes leave a 2:1
  # majority. Uniform config on purpose — per-node differentiation is the
  # PBT-at-genesis devnet's job; this one wants minimum variables on
  # untested code paths.
  #
  # --cache.preimages on the server run is groundwork for re-anchoring at a
  # height H > 0 (milestone 2): the genesis-anchored conversion happens in the
  # shim regardless. --syncmode=full: makes from-genesis execution explicit
  # and unconditional. Snap is supported since #31 (the follower idles during
  # snap sync), and on a fresh devnet where all nodes start at genesis snap
  # would collapse to full anyway; full removes the conditional rather than
  # changing behavior. The devnet's purpose is that every node executes every
  # block and runs the artifact flow continuously.
  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

network_params:
  # Load-bearing exactly as in devnet.yaml: the geth launcher picks full sync
  # and the devnet genesis path only for this name.
  network: "kurtosis"
  # mainnet, NOT minimal — under minimal the consensus clients lose every
  # peer minutes in (see devnet.yaml).
  preset: mainnet
  seconds_per_slot: 6
  # 60, not devnet.yaml's 20: the acceptance criterion counts blocks BEFORE
  # the fork block, so bring-up slot misses eat directly into the margin.
  genesis_delay: 60
  # Amsterdam at EL block 0 (BALs from the first block — the shadow advances
  # by replaying them), which forces Gloas at CL slot 0.
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0

ethereum_genesis_generator_params:
  # The pbt-egg fork. PBT selects the tree; the ACTIVATION OFFSET is not
  # written here — main.star injects PBT_OFFSET_SECONDS from pbt_migration so
  # the number exists in exactly one place.
  image: pbt-egg:local
  extra_env:
    PBT: "true"

# Same services, same ORDER as devnet.yaml — published host ports are
# public_port_start + 2*index, so reordering silently moves every UI.
additional_services:
  - dora        # 36000  block explorer
  - spamoor     # 36002  transaction spammer + UI
  - assertoor   # 36004  test playbooks + UI
  - disruptoor  # 36006  partition injection (needs `kurtosis run --privileged`)

port_publisher:
  additional_services:
    enabled: true
    public_port_start: 36000

dora_params:
  image: ethpandaops/dora:latest

spamoor_params:
  # Verbatim from devnet.yaml: the acceptance load for milestone 1 is
  # spamoor's four scenarios, nothing else (the hammer is off below).
  start_chainload: false
  start_fuzzing: false
  spammers:
    - scenario: eoatx
      name: "EOA baseline"
      config: {throughput: 20, max_pending: 40, max_wallets: 40, base_fee: 20}
    - scenario: deploytx
      name: "Contract deploys (code-zone leaves)"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}
    - scenario: setcodetx
      name: "EIP-7702 delegations"
      config: {throughput: 2, max_pending: 4, max_wallets: 10, base_fee: 20}
    - scenario: storagespam
      name: "Storage growth"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}

assertoor_params:
  # Same reasoning as devnet.yaml: this devnet destabilises itself.
  run_stability_check: false
  run_block_proposal_check: true
  run_transaction_test: true
  tests:
    - https://raw.githubusercontent.com/ethpandaops/assertoor/master/playbooks/dev/synchronized-check.yaml

disruptoor_params:
  image: ethpandaops/disruptoor:latest

### Everything below is ours, not ethereum-package's.

# OFF for milestone-1 acceptance (decision D9): the stated load is "spamoor
# and some reorgs"; the hammer adds an uncontrolled variable on a 4-node net
# doing merkle+shadow double work. Enabling it is a documented
# post-acceptance experiment.
pbt_hammer:
  enabled: false

pbt_monitor:
  # In migration mode this is the MERKLE-PATRICIA genesis root (the chain
  # starts on the merkle trie). Obtain it from the first run's
  # eth_getBlockByNumber(0x0).stateRoot, then pin it here; acceptance
  # requires it set, and verify/pins.yaml carries the same value.
  # NOTE: the monitor's migration-aware oracles (shadow, boundary) live in
  # migration-monitor, not here; pbtmonitor keeps running its legacy
  # same-height cross-client comparison, which stays valid pre-fork.
  expected_genesis_root: ""

# The legacy pbtchaos does NOT run in migration mode (main.star skips it
# unconditionally once pbt_migration.enabled is true — its reorg cadence is
# not admission-gated against the fork boundary). Disruption instead comes
# from pbt_migration.chaos_profile below.
pbt_chaos: {}

# Ours (main.star): the single source of truth for the fork offset. T =
# genesis(block 0).timestamp + fork_offset_seconds. 2400s = 400 slots at 6s;
# expected canonical blocks before T ≈ 400 − bring-up misses (~10-30) −
# chaos losses under the r3 profile (~15-25) ≈ 340 — wide margin over the
# ≥100 the acceptance harness needs (it counts blocks strictly before the
# fork block). chaos_profile: r3 is migration-chaos's full reorg profile,
# admission-gated to hard-stop at T-300s.
pbt_migration:
  enabled: true
  fork_offset_seconds: 2400
  chaos_profile: r3
