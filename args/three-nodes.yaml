# Three nodes, added purely in config — nothing in main.star changes.
#
# This is the worked example the README's "Adding a client" section points at: a second
# entry under default_ethereum_client_images plus one more entry in `nodes` is all it
# takes. With N nodes each block is validated N-1 times, and a disagreement among three
# is a 2-1 split that names the odd one out rather than a tie.

### Execution layer clients
default_ethereum_client_images:
  geth: pbt-geth:local

client_sources:
  geth:
    repository: CPerezz/go-ethereum
    ref: pbt
    path: ../go-ethereum

nodes:
  - name: geth-a
    client: geth
    extra_flags: ["--cache=512", "--cache.trie=10"]
  - name: geth-b
    client: geth
    extra_flags: ["--cache=3072", "--cache.trie=40", "--gcmode=archive", "--cache.preimages"]
  - name: geth-c
    client: geth
    extra_flags: ["--cache=1024", "--cache.trie=25"]

# Asserted against every node's genesis state root at preflight: the client-agnostic
# proof that the chain is committing state with the binary tree. Printed by gengenesis.
expected_genesis_root: "0x7e16e8798b8f3d27d4bea3c13cac4b459fdaa8e0baca8089ce1fb834f2b2820a"

slot_time: "3s"
slots: 0
reorg_every: 12
reorg_depth: 2
probe_every: 8

hammer_enabled: true
hammer_interval: "400ms"
hammer_batch: 4
hammer_slots_per_tx: 20
hammer_code_size: 12000
