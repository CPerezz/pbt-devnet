# Fast debugging profile. Two clients, almost no traffic, no extra tooling — the point is
# a four-minute loop you can read the logs of, not a representative devnet.
#
#   make fast          == make up ARGS=args/fast.yaml
#
# args/devnet.yaml stays the reference configuration; this file exists to reproduce one
# specific failure quickly. The three-chain split shows up around block 35-40, roughly
# four minutes in, so a run does not need to be long — it needs to be quiet.

participants:
  # One geth and one besu. Two is the minimum that can disagree. The reference config runs
  # four — two of each client, with the pairs configured differently — to tell "besu is
  # wrong" from "we are wrong", and to keep a majority that can still finalize while one
  # node is partitioned. Neither distinction is what a peering repro tests, and dropping
  # them halves startup time and log volume.
  #
  # Note the consequence: with two nodes a partition leaves the majority at 1/2, which
  # cannot finalize. Use args/devnet.yaml for anything involving scenarios.
  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--state.size-tracking"]

  - el_type: besu
    el_image: besu-pbt:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--data-storage-format=BINARY"]

network_params:
  network: "kurtosis"
  # mainnet, NOT minimal. This is load-bearing and the failure it prevents is ugly.
  #
  # Under preset: minimal the consensus clients peer normally, run for about three and a
  # half minutes, then lose every peer within the same second and never reconnect. Each
  # one then computes its own proposer schedule and drives its own execution client down
  # its own chain, so the devnet silently becomes N separate chains that each look healthy.
  # Measured: divergence at block 35 exactly, with both two and three participants, so it
  # is deterministic and not a race or a node-count effect. Under mainnet the same config
  # runs past block 67 with peers stable.
  #
  # The mechanism inside lighthouse is not identified; the ethpandaops glamsterdam-devnet-8
  # images are built for mainnet-preset devnets and that is what the working reference
  # setups use. `make diagnose` shows the signature: a first-divergence block sitting
  # exactly where the peer count fell to zero.
  preset: mainnet
  seconds_per_slot: 6
  genesis_delay: 20
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0

ethereum_genesis_generator_params:
  image: pbt-egg:local
  extra_env:
    PBT: "true"

# dora to watch the chain, disruptoor because reorg testing is the eventual point.
# No spamoor, assertoor or forky: every extra service is more log to read and more
# traffic between the thing being measured and the measurement.
additional_services:
  - dora        # 37000
  - disruptoor  # 37002

port_publisher:
  additional_services:
    # A different range from args/devnet.yaml on purpose. Published ports are bound on the
    # host, so two enclaves sharing a public_port_start cannot both run — the second dies
    # with "port is already allocated" from Docker, several layers below anything that
    # mentions Kurtosis. Keeping the debug profile on its own range means you can leave a
    # long run up while iterating.
    enabled: true
    public_port_start: 37000

### Ours.

pbt_hammer:
  # A trickle, not a flood. Enough that blocks are not empty, little enough that the
  # monitor's output stays readable and a divergence is not buried.
  enabled: true
  interval: "2s"
  batch: 1
  slots_per_tx: 4
  code_size: 2000
  senders: 2

pbt_monitor:
  enabled: true
  verify_oracle: true
  poll: "2s"
  probe_every: 16
