# Config for the PBT devnet. Everything except the two pbt_* blocks at the bottom is
# ethpandaops/ethereum-package's own schema — it sanity-checks its input and fails on any
# key it does not recognise, so consult its README rather than inventing fields here.

participants:
  # Four nodes, two of each client, and within each pair two deliberately different
  # configs. Instances of one binary with one config agree by construction and prove
  # nothing; these are pushed down different paths through the same tree and required to
  # produce identical roots.
  #
  # Four rather than three is what lets the network finalize through a partition: isolating
  # one of three leaves the majority holding exactly 2/3, and finality needs MORE than 2/3,
  # so every scenario used to run against a majority that could not finalize. One of four
  # leaves 3/4.
  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    # Part of the full-sync condition in geth_launcher.star. The binary tree refuses snap
    # sync outright, so this is not a preference.
    checkpoint_sync_enabled: false
    el_extra_params: ["--state.size-tracking"]

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_storage_type: archive
    # The archive branch of geth_launcher.star emits --gcmode=archive and NO --syncmode at
    # all, so geth would fall back to snap. Because the launcher passes nothing here, this
    # is an addition rather than a conflicting duplicate.
    el_extra_params: ["--syncmode=full"]

  # The second implementation, and the whole point: geth agreeing with geth shows
  # consistency, geth agreeing with besu shows correctness.
  - el_type: besu
    el_image: besu-pbt:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    # Besu's switch for the tree. Must NOT be combined with el_storage_type: archive —
    # that makes besu_launcher.star append --data-storage-format=FOREST, which contradicts
    # BINARY.
    el_extra_params: ["--data-storage-format=BINARY"]

  - el_type: besu
    el_image: besu-pbt:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    # The same tree, but every trie log kept instead of pruned to the default window.
    #
    # This is the axis that matters for reorgs: besu unwinds a branch by REVERSING trie
    # logs where geth replaces layers, and a missing log is the mechanism behind the
    # StateRootMismatchException in issue #7. If the pruning besu above fails a deep reorg
    # and this one survives it, the difference names the cause. The differentiator is
    # deliberately the MORE capable config — a crippled node would manufacture failures
    # rather than isolate one.
    el_extra_params: ["--data-storage-format=BINARY", "--bonsai-limit-trie-logs-enabled=false"]

network_params:
  # Load-bearing, and its effect is indirect. Both el launchers choose full sync only when
  # the network is named "kurtosis"; any custom name silently yields --syncmode=snap /
  # --sync-mode=SNAP, which the binary tree refuses, and the engine API then goes quiet.
  network: "kurtosis"
  # mainnet, NOT minimal. This is load-bearing and the failure it prevents is ugly.
  #
  # Under preset: minimal the consensus clients peer normally, run for about three and a
  # half minutes, then lose every peer within the same second and never reconnect. Each
  # one then computes its own proposer schedule and drives its own execution client down
  # its own chain, so the devnet silently becomes N separate chains that each look healthy.
  # Measured: divergence at block 35 exactly, with both two and three participants, so it
  # is deterministic and not a race or a node-count effect. Under mainnet the same config
  # runs past block 67 with peers stable.
  #
  # The mechanism inside lighthouse is not identified; the ethpandaops glamsterdam-devnet-8
  # images are built for mainnet-preset devnets and that is what the working reference
  # setups use. `make diagnose` shows the signature: a first-divergence block sitting
  # exactly where the peer count fell to zero.
  preset: mainnet
  seconds_per_slot: 6
  genesis_delay: 20
  # PBT is a property of the chain from genesis and requires Amsterdam, so the execution
  # layer is Amsterdam at block 0 — which forces the consensus layer to be Gloas at slot 0.
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0

ethereum_genesis_generator_params:
  # Fork of ethereum-genesis-generator: emits "binaryTrieTime" — ONE key, taken by both
  # clients — into genesis.json, and bundles a fork of eth-beacon-genesis that derives the
  # consensus genesis from the binary-tree block hash instead of a merkle-patricia one.
  # Build with scripts/build-images.sh.
  #
  # The PBT env var below is named after the retired `"pbt": true` boolean; it now selects
  # the activation timestamp. The name is historical, the behaviour is not.
  image: pbt-egg:local
  extra_env:
    PBT: "true"

# Deliberately NO builder. buildoor wires one shared builder to participant 0's execution
# client, so every payload on the chain would be built by that one node and the others
# would only ever import — precisely the half of each client this harness exists to
# compare. Without it each proposer builds locally through its own engine API, so geth and
# besu both propose and both validate.
#
# ORDER IS PART OF THE CONTRACT: published host ports are
# port_publisher.additional_services.public_port_start + 2*index, so reordering this list
# silently moves every UI. `make ui` reads the real ports rather than assuming these.
additional_services:
  - dora        # 36000  block explorer
  - spamoor     # 36002  transaction spammer + UI
  - assertoor   # 36004  test playbooks + UI
  - forky       # 36006  fork / reorg visualiser
  - disruptoor  # 36008  partition and latency injection (needs `kurtosis run --privileged`)

port_publisher:
  additional_services:
    enabled: true
    public_port_start: 36000

dora_params:
  image: ethpandaops/dora:latest

spamoor_params:
  # Setting `spammers` REPLACES both built-in defaults, so everything wanted is listed.
  # Scenarios chosen for what the binary tree changed rather than for raw throughput; the
  # hammer covers the shapes spamoor has no scenario for (zeroization, shared code,
  # 7702 clear-to-zero).
  # The built-in chain-load group is off: it adds unmeasured traffic on top of the four
  # spammers below, and it is what backs up into a partitioned minority. A healthy chain
  # here runs about 14% of the 200M gas limit, so there is nothing else to trim.
  start_chainload: false
  start_fuzzing: false
  spammers:
    - scenario: eoatx
      name: "EOA baseline"
      config: {throughput: 20, max_pending: 40, max_wallets: 40, base_fee: 20}
    - scenario: deploytx
      name: "Contract deploys (code-zone leaves)"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}
    - scenario: setcodetx
      name: "EIP-7702 delegations"
      config: {throughput: 2, max_pending: 4, max_wallets: 10, base_fee: 20}
    - scenario: storagespam
      name: "Storage growth"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}

assertoor_params:
  run_stability_check: true
  run_block_proposal_check: true
  # Built-in checks only. Custom playbooks cannot be mounted from this package — the
  # launcher only uploads its own baked-in /tests directory — and reorgs are pbtchaos's
  # job, with verification a playbook could not do.
  tests: []

# Chaos sidecar. pbtchaos owns its state exclusively and drives it continuously, so the
# default devnet is NOT quiet: expect a reorg every 15-30 blocks. `make split` / `make heal`
# poke it by hand; `make scenario` runs one of the six state scenarios.
disruptoor_params:
  image: ethpandaops/disruptoor:latest

### Everything below is ours, not ethereum-package's.

pbt_hammer:
  enabled: true
  # Measured at interval 400ms / batch 4 / code_size 12000: blocks ran 74.9% full against a
  # 50% gas target, so the base fee compounded 12.5% a block -- 3,600 to 6,400 gwei in
  # eight blocks -- until scenario transactions could not be paid for within the node's
  # 1 ether cap. Nothing pushes back before that point, so the rate has to.
  #
  # 10 tx/s at 12,000 bytes a deploy is ~18M state gas each (1530 per byte); this is 2 tx/s
  # at half the size.
  interval: "1s"
  batch: 2
  slots_per_tx: 20
  code_size: 6000
  senders: 4
  # only: zeroize        # restrict to one workload; see the README for the list

# Reorgs. On by default: expect one every 15-30 blocks, and the six state scenarios on
# demand via `make scenario`. Set enabled: false for a quiet baseline, which is what
# `make proposals` needs to measure a proposer's miss rate.
pbt_chaos:
  enabled: true
  isolate_min_blocks: 15
  isolate_max_blocks: 30

pbt_monitor:
  enabled: true
  # Corrupt a state root on purpose at startup and require every other client to reject
  # it. Without it a later "0 findings" is indistinguishable from a broken oracle.
  verify_oracle: true
  poll: "2s"
  probe_every: 8
