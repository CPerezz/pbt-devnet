# FAST inner-loop variant of migration-smoke: offset 240s (b* ~ block 40).
# Deliberately BELOW the C1 floor (>=100 pre-fork blocks) - verify-migration
# is expected to fail C1 here and pass the rest under --smoke --skip-chaos.
# Total wall ~13min: 35s boot + 240s runway + ~520s finality close of the
# merkle window (T+518..521s in every measured run - consensus physics,
# not migration work; the shim's convert+import is ~3s).
# Config for a fast migration SMOKE run: 1 geth node, no chaos, short fork offset.
#
# Not an acceptance run — one node has nobody to disagree with, so pbt_monitor
# (which needs >=2 execution clients) is off and migration-monitor is the only
# oracle. This exists to catch a broken image/wiring in minutes: does the shim
# boot, does the chain reach binaryTrieTime, does migration-monitor see the
# switchover — before spending the ~2h a chaos-smoke or full run costs.
#
# Everything except the pbt_* blocks is ethpandaops/ethereum-package's own
# schema — it fails on any key it does not recognise.

participants:
  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]
    el_extra_env_vars:
      PBT_MIGRATION: "1"

network_params:
  network: "kurtosis"
  preset: mainnet
  seconds_per_slot: 6
  genesis_delay: 60
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0

ethereum_genesis_generator_params:
  image: pbt-egg:local
  extra_env:
    PBT: "true"

additional_services:
  - dora        # 36000  block explorer
  - spamoor     # 36002  transaction spammer + UI
  - assertoor   # 36004  test playbooks + UI
  - disruptoor  # 36006  partition injection (needs `kurtosis run --privileged`); unused here (chaos_profile: none) but kept so port ordering matches every other migration args file

port_publisher:
  additional_services:
    enabled: true
    public_port_start: 36000

dora_params:
  image: ethpandaops/dora:latest

spamoor_params:
  start_chainload: false
  start_fuzzing: false
  spammers:
    - scenario: eoatx
      name: "EOA baseline"
      config: {throughput: 20, max_pending: 40, max_wallets: 40, base_fee: 20}
    - scenario: deploytx
      name: "Contract deploys (code-zone leaves)"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}
    - scenario: setcodetx
      name: "EIP-7702 delegations"
      config: {throughput: 2, max_pending: 4, max_wallets: 10, base_fee: 20}
    - scenario: storagespam
      name: "Storage growth"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}

assertoor_params:
  run_stability_check: false
  run_block_proposal_check: true
  run_transaction_test: true
  tests:
    - https://raw.githubusercontent.com/ethpandaops/assertoor/master/playbooks/dev/synchronized-check.yaml

disruptoor_params:
  image: ethpandaops/disruptoor:latest

### Everything below is ours, not ethereum-package's.

pbt_hammer:
  enabled: false

# One node: pbt_monitor needs a second opinion it does not have here.
# migration-monitor (always on under pbt_migration) is the smoke test's oracle.
pbt_monitor:
  enabled: false

# 600s = 100 slots at 6s: enough bring-up margin to reach the fork without an
# hour-long run. No chaos (chaos_profile: none) — a smoke test isolates
# "does the fork itself work" from "does it survive disruption".
pbt_migration:
  enabled: true
  fork_offset_seconds: 240
  chaos_profile: none
