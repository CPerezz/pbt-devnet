# Offline EIP-8347 migration lap: migration.yaml's network, load and chaos, plus the offline
# path end to end. A disposable non-validating geth (participant 6) and erigon (2) export a PBT
# snapshot and preimage file at their head; once that block has finalized, Nethermind (5) and geth (3)
# each stop, import the other client's artifacts, restart and replay block access lists to the
# head, one at a time and in a chaos-free gap, before binaryTrieTime. `make migration-offline`.
# Non-pbt_* keys are ethereum-package schema.

# Validator stake is rendered by main.star from pbt_migration.anchor_node: the bootnode
# anchors 29% (224 validators) and is never partitioned; the four lights it forces back onto
# its chain hold 18% each (136), so a pair (35%) still stalls finality without winning a heal.
participants:
  # Participant 1 is the bootnode (no --boot-nodes of its own) and is never disrupted.
  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]

  - el_type: erigon
    el_image: erigon-pbt:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_env_vars: {COMMITMENT_HEX_BIN: "true"}

  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--cache.preimages", "--syncmode=full"]

  # Participant 4 is besu: it starts on the merkle trie like the others and switches
  # at binaryTrieTime. No --data-storage-format: that fixes the format for the whole
  # datadir at startup, which is what makes a node unable to migrate. The threshold
  # is besu's reorg logging gate, default 6, above the depth of most heals here.
  - el_type: besu
    el_image: besu-pbt:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--reorg-logging-threshold=0"]

  # Participant 5 is Nethermind: flat (merkle) state mirrored into its PBT backend
  # before I*; PBT canonical from I* on, with the merkle side kept as a shadow until
  # the fork block finalizes (EIP-8347 wants both trees through the transition window),
  # and the PBT anchor bootstrapped from the MPT genesis allocation rather than an
  # exported snapshot.
  - el_type: nethermind
    el_image: nethermind-pbt:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    el_extra_params: ["--Pbt.Enabled=true", "--Pbt.MigrationGenesisBootstrap=true", "--Sync.FastSync=false"]

  # Participant 6 is the disposable exporter: geth with the preimage store, no validators,
  # so stopping it to convert costs no stake. Non-validating participants come last.
  - el_type: geth
    el_image: pbt-geth:local
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:glamsterdam-devnet-8
    checkpoint_sync_enabled: false
    validator_count: 0
    el_extra_params: ["--cache.preimages", "--syncmode=full"]

network_params:
  # "kurtosis" is the only network name for which the geth launcher picks full sync.
  network: "kurtosis"
  preset: mainnet
  seconds_per_slot: 6
  genesis_delay: 60
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0

ethereum_genesis_generator_params:
  # main.star injects PBT_OFFSET_SECONDS from pbt_migration.fork_offset_seconds.
  image: pbt-egg:local
  extra_env:
    PBT: "true"

# Order matters: published host ports are public_port_start + 2*index.
additional_services:
  - dora        # 36000  block explorer
  - spamoor     # 36002  transaction spammer + UI
  - assertoor   # 36004  test playbooks + UI
  - disruptoor  # 36006  partition injection (needs `kurtosis run --privileged`)

port_publisher:
  additional_services:
    enabled: true
    public_port_start: 36000

dora_params:
  image: ethpandaops/dora:latest

spamoor_params:
  start_chainload: false
  start_fuzzing: false
  spammers:
    - scenario: eoatx
      name: "EOA baseline"
      config: {throughput: 20, max_pending: 40, max_wallets: 40, base_fee: 20}
    - scenario: deploytx
      name: "Contract deploys (code-zone leaves)"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}
    - scenario: setcodetx
      name: "EIP-7702 delegations"
      config: {throughput: 2, max_pending: 4, max_wallets: 10, base_fee: 20}
    - scenario: storagespam
      name: "Storage growth"
      config: {throughput: 3, max_pending: 6, max_wallets: 10, base_fee: 20}

assertoor_params:
  run_stability_check: false
  run_block_proposal_check: true
  run_transaction_test: true
  tests:
    - https://raw.githubusercontent.com/ethpandaops/assertoor/master/playbooks/dev/synchronized-check.yaml

disruptoor_params:
  image: ethpandaops/disruptoor:latest

### Everything below is ours, not ethereum-package's.

# pbt_hammer: extra transaction load; off so spamoor is the only load.
pbt_hammer:
  enabled: false

# pbt_monitor: same-height cross-client root comparison; genesis pin lives in verify/pins.yaml.
pbt_monitor:
  expected_genesis_root: ""

# pbt_chaos: tree-at-genesis reorg service, gated until every client finishes migrating;
# depth capped so a post-fork reorg stays healable.
pbt_chaos:
  gate: true
  gate_max_depth: 8
# pbt_migration: fork offset and chaos schedule. 3000s = 500 slots at 6s: migration.yaml's
# composite chaos verbatim, plus a calm span after its last pre-fork heal (+940, +120 to
# converge) long enough to finalize the anchor and run both swaps before the straddle.
pbt_migration:
  enabled: true
  anchor_validators: 224
  light_validators: 136
  fork_offset_seconds: 3000
  chaos_profile: composite
  post_op: deep-pair
  # Driven by cmd/migration-swap. Consumers swap in list order. Budgets from a smoke enclave:
  # geth went stop -> caught up in 9 s, Nethermind stop -> reachable in 18 s. The timeout is
  # short enough that a first swap's failure still leaves the second room before the fork.
  offline:
    enabled: true
    export_after_seconds: 1080
    margin_seconds: 300
    producers:
      - {node: 6, kind: geth-convert, consumers: [5]}
      - {node: 2, kind: erigon-export, consumers: [3]}
    consumers:
      - {node: 5, expected_seconds: 120, timeout_seconds: 420}
      - {node: 3, expected_seconds: 120, timeout_seconds: 420}
    online_only:
      - {node: 1, reason: "protected anchor: stays on the online path"}
      - {node: 2, reason: "erigon has no cross-client importer"}
      - {node: 4, reason: "besu has no importer"}
