name: github.com/CPerezz/pbt-devnet
description: |
  A mixed geth/besu devnet on the EIP-8297 partitioned binary tree, post-Amsterdam, driven
  by real consensus clients. Composes ethpandaops/ethereum-package and adds a differential
  monitor that requires every execution client to agree on every state root, plus a
  transaction generator aimed at what the binary tree changed.
