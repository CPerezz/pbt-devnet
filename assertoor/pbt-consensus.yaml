id: pbt-consensus
name: "PBT consensus stability (geth + besu)"
description: |
  Holds an observation window over the devnet and fails the moment any client stops
  following the chain. This is the baseline check: on a binary-tree chain the interesting
  failure is one execution client quietly falling behind while everything still looks
  healthy, which is exactly what check_clients_are_healthy latches on.
timeout: 60m
config:
  observationSlots: 50
  minimumClientCount: 3
tasks:
  - name: check_clients_are_healthy
    title: "Every client pair is healthy before we start"
    timeout: 15m
    configVars:
      minClientCount: "minimumClientCount"
    config:
      maxUnhealthyCount: 0

  - name: check_consensus_slot_range
    id: window_start
    title: "Record the slot the window starts at"
    timeout: 2m
    config: {}

  - name: run_task_background
    title: "Hold every invariant for the whole window"
    timeout: 40m
    config:
      onBackgroundComplete: "failOrIgnore"
      exitOnForegroundFailure: true
      foregroundTask:
        name: check_consensus_slot_range
        title: "Advance observationSlots slots"
        configVars:
          minSlotNumber: "| (.tasks.window_start.outputs.currentSlot | tonumber) + (.observationSlots | tonumber)"
      backgroundTask:
        name: run_tasks_concurrent
        title: "Invariants"
        config:
          tasks:
            - name: check_clients_are_healthy
              title: "No client may become unhealthy"
              config:
                maxUnhealthyCount: 0
                failOnCheckMiss: true
                continueOnPass: true
                pollInterval: 5s
            - name: check_execution_sync_status
              title: "Every execution client keeps following the chain"
              config:
                expectSyncing: false
                expectMinPercent: 100
                expectMaxPercent: 100
                waitForChainProgression: true
                continueOnPass: true

  - name: check_consensus_finality
    title: "The chain finalized during the window"
    timeout: 25m
    config:
      minFinalizedEpochs: 2
      maxUnfinalizedEpochs: 4
