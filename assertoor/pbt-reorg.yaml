id: pbt-reorg
name: "PBT reorg under partition (geth + besu)"
description: |
  Splits the devnet, holds the split, heals it, and requires the chain to reconverge and
  finalize again.

  Two things about this test are deliberate. The background reorg check carries a BUDGET
  rather than requiring zero: healing a partition is itself a reorg, so a strict zero-reorg
  hold would fail by construction. And the strict check runs only after reconvergence.

  KNOWN ISSUE: consensus clients have not been observed to re-peer after a heal on this
  devnet, so this test currently fails at the reconvergence step. It is checked in because
  the failure is the finding — see the README's "Known issues".
timeout: 90m
config:
  disruptoorApiUrl: "http://disruptoor:7700"
  minimumClientCount: 3
  splitDurationSlots: 16
  maxReorgDistanceDuringSplit: 64
  maxTotalReorgsDuringSplit: 6
tasks:
  - name: run_shell
    title: "Disruptoor is up and can see the enclave"
    timeout: 3m
    config:
      envVars:
        DISRUPTOOR_URL: disruptoorApiUrl
      command: |
        set -euo pipefail
        url=$(echo "$DISRUPTOOR_URL" | jq -r .)
        curl -fsS "${url}/v1/healthz" >/dev/null
        seen=$(curl -fsS "${url}/webui/api/containers" | jq '.containers | length')
        echo "disruptoor sees ${seen} containers"
        # A partition against an empty container set would apply cleanly and do nothing,
        # which reads identically to a healthy chain.
        [ "$seen" -ge 2 ] || { echo "disruptoor cannot see the enclave" >&2; exit 1; }

  - name: check_clients_are_healthy
    title: "Healthy before we break anything"
    timeout: 15m
    configVars:
      minClientCount: "minimumClientCount"
    config:
      maxUnhealthyCount: 0

  - name: check_consensus_finality
    id: initial_finality
    title: "Finalizing before the split"
    timeout: 30m
    config:
      minFinalizedEpochs: 2
      maxUnfinalizedEpochs: 4

  - name: check_consensus_slot_range
    id: split_start
    title: "Record the split start slot"
    timeout: 2m
    config: {}

  - name: run_task_background
    title: "Split, hold, heal — under a reorg budget"
    timeout: 40m
    config:
      onBackgroundComplete: "failOrIgnore"
      exitOnForegroundFailure: true
      backgroundTask:
        name: check_consensus_reorgs
        title: "Reorg budget must not be blown"
        configVars:
          maxReorgDistance: "maxReorgDistanceDuringSplit"
          maxTotalReorgs: "maxTotalReorgsDuringSplit"
        config:
          minCheckEpochCount: 1
          continueOnPass: true
      foregroundTask:
        name: run_tasks
        title: "Partition, observe, heal"
        config:
          tasks:
            - name: run_shell
              title: "Partition {1,2} | {3} on el and cl"
              timeout: 3m
              config:
                envVars:
                  DISRUPTOOR_URL: disruptoorApiUrl
                command: |
                  set -euo pipefail
                  url=$(echo "$DISRUPTOOR_URL" | jq -r .)
                  curl -fsS -X PUT "${url}/v1/state" -H 'Content-Type: application/json' -d '{
                    "partitions": [{
                      "name": "pbt-reorg-split",
                      "groups": [
                        {"node-index": [1,2], "client-type": ["execution","beacon"]},
                        {"node-index": [3],   "client-type": ["execution","beacon"]}
                      ],
                      "scope": ["el_p2p","cl_p2p"],
                      "symmetric": true
                    }]
                  }' >/dev/null
                  curl -fsS "${url}/v1/state" | jq -e '.partitions | length == 1' >/dev/null

            - name: check_consensus_slot_range
              title: "Hold the split"
              timeout: 20m
              configVars:
                minSlotNumber: "| (.tasks.split_start.outputs.currentSlot | tonumber) + (.splitDurationSlots | tonumber)"

            - name: run_shell
              title: "Heal"
              timeout: 3m
              config:
                envVars:
                  DISRUPTOOR_URL: disruptoorApiUrl
                command: |
                  set -euo pipefail
                  url=$(echo "$DISRUPTOOR_URL" | jq -r .)
                  curl -fsS -X POST "${url}/v1/state/clear" >/dev/null
                  curl -fsS "${url}/v1/state" | jq -e '(.partitions | length) == 0' >/dev/null

  - name: run_tasks_concurrent
    title: "Reconverged after the heal"
    timeout: 25m
    config:
      tasks:
        - name: check_clients_are_healthy
          title: "All clients healthy again"
          config:
            maxUnhealthyCount: 0
        - name: check_execution_sync_status
          title: "Execution clients following again"
          config:
            expectSyncing: false
            expectMinPercent: 100
            expectMaxPercent: 100
            waitForChainProgression: true

  - name: check_consensus_finality
    title: "Fresh finality after recovery"
    timeout: 30m
    configVars:
      minFinalizedEpochs: "| (.tasks.initial_finality.outputs.finalizedEpoch | tonumber) + 1"
    config:
      maxUnfinalizedEpochs: 6

cleanupTasks:
  - name: run_shell
    title: "Always clear disruptoor state"
    timeout: 3m
    config:
      envVars:
        DISRUPTOOR_URL: disruptoorApiUrl
      command: |
        set -euo pipefail
        url=$(echo "$DISRUPTOOR_URL" | jq -r .)
        curl -fsS -X POST "${url}/v1/state/clear" >/dev/null || \
          echo "WARNING: could not clear disruptoor; the devnet may still be partitioned" >&2
